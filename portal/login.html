<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal Login | Modern College</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css?v=2">
    <link rel="stylesheet" href="css/portal.css?v=2">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <a href="../index.html" class="nav-brand" style="justify-content: center; margin-bottom: 1rem;">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                </a>
                <h2>Student Portal</h2>
                <p style="color: var(--text-secondary); font-size: 0.875rem;">Enter your credentials to access your dashboard</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="studentId">Student ID</label>
                    <input type="text" id="studentId" class="form-control" placeholder="e.g. STU2026" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <p id="loginError" class="error-msg">Invalid credentials. Try STU2026 / password</p>
                <button type="submit" class="btn btn-primary btn-full" style="margin-top: 1rem;">Login to Portal</button>
                
                <div style="text-align: center; margin-top: 1.5rem;">
                    <a href="../index.html" style="font-size: 0.875rem; color: var(--text-secondary);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Back to Home</a>
                </div>
            </form>
        </div>
    </div>

    <script src="js/portal.js"></script>
</body>
</html>
